name: Build & Push Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tags
        run: |
          echo "DATE_TAG=$(date +%Y.%m.%d)" >> $GITHUB_ENV
          echo "SHA_TAG=sha-${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build & Push API
        run: |
          docker build -t cooldruid12/rpweave.api:edge ./src/RpWeave.Server
          docker tag yourorg/backend:edge cooldruid12/rpweave.api:${DATE_TAG}-${SHA_TAG}
          docker push cooldruid12/rpweave.api:edge
          docker push cooldruid12/rpweave.api:${DATE_TAG}-${SHA_TAG}

      - name: Build & Push Frontend
        run: |
          docker build -t cooldruid12/rpweave.ui:edge ./src/RpWeave.Client
          docker tag yourorg/backend:edge cooldruid12/rpweave.ui:${DATE_TAG}-${SHA_TAG}
          docker push cooldruid12/rpweave.ui:edge
          docker push cooldruid12/rpweave.ui:${DATE_TAG}-${SHA_TAG}
